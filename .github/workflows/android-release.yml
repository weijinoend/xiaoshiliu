name: Build & Release DeepChat Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.2)'
        required: true
      version_code:
        description: 'Android versionCode (optional, defaults to android/app/build.gradle)'
        required: false

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$SDK_DIR/platforms/android-34" ] || [ ! -d "$SDK_DIR/build-tools/34.0.0" ]; then
              "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        run: |
          pnpm run type
          pnpm run lint

      - name: Resolve Release Version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag format: $TAG"
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          if [ -n "$INPUT_VERSION_CODE" ]; then
            if [[ ! "$INPUT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid version_code: $INPUT_VERSION_CODE"
              exit 1
            fi
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_CODE="$(grep -oE 'deepchatVersionCode.*:[[:space:]]*[0-9]+' android/app/build.gradle | grep -oE '[0-9]+' | tail -n1)"
            if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not determine default versionCode from android/app/build.gradle"
              exit 1
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          TAG_NOTES="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          {
            echo "notes<<__DEEPCHAT_NOTES_EOF__"
            printf '%s\n' "$TAG_NOTES"
            echo "__DEEPCHAT_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build web bundle & sync Android assets
        run: |
          pnpm run build
          pnpm exec cap sync android
          node scripts/make-android-icons.mjs

      - name: Decode Android signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS || 'android' }}
          SIGNING_KEYSTORE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret."
            exit 1
          fi
          node -e "
            const fs = require('node:fs');
            const raw = (process.env.SIGNING_KEYSTORE_BASE64 || '').replace(/\s+/g, '');
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(raw)) {
              console.error('SIGNING_KEYSTORE_BASE64 contains invalid base64 characters.');
              process.exit(1);
            }
            const buf = Buffer.from(raw, 'base64');
            console.log('Decoded keystore bytes:', buf.length);
            if (buf.length < 100) {
              console.error('Decoded keystore looks too small or invalid.');
              process.exit(1);
            }
            fs.writeFileSync('android/release.keystore', buf, { mode: 0o600 });
          "
          keytool -list -keystore android/release.keystore -storepass:env SIGNING_KEYSTORE_PASS -alias "$SIGNING_KEYSTORE_ALIAS" > /dev/null

      - name: Build signed Release APK
        env:
          DEEPCHAT_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          DEEPCHAT_KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS || 'android' }}
          DEEPCHAT_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          DEEPCHAT_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS || secrets.SIGNING_KEYSTORE_PASS || 'android' }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PdeepchatVersionCode="$VERSION_CODE" \
            -PdeepchatVersionName="$VERSION_NAME" \
            --no-daemon

      - name: Prepare Release APK artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/DeepChat-${RELEASE_TAG}.apk"

      - name: Cleanup signing keystore
        if: always()
        shell: bash
        run: rm -f android/release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DeepChat ${{ steps.ver.outputs.tag }}
          body: ${{ steps.ver.outputs.notes }}
          generate_release_notes: true
          files: |
            release-assets/DeepChat-${{ steps.ver.outputs.tag }}.apk
